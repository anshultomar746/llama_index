[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-llms-parallel-web"
version = "0.1.0"
description = "LlamaIndex LLMs integration for Parallel AI"
authors = [{name = "Anshul Tomar", email = "anshul@parallel.ai"}]
requires-python = ">=3.9,<4.0"
readme = "README.md"
license = "MIT"
dependencies = [
    "llama-index-llms-openai-like>=0.4.0,<0.5",
    "llama-index-core>=0.12.0,<0.13",
]

[tool.hatch.build.targets.sdist]
include = ["llama_index/llms/parallel_web/"]

[tool.hatch.build.targets.wheel]
include = ["llama_index/llms/parallel_web/"]

[tool.llamahub]
contains_example = true
import_path = "llama_index.llms.parallel_web"

[tool.llamahub.class_authors]
ParallelWeb = "llama-index"
